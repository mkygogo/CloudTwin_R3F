version: '3.8'

services:
  frontend:
    build: .
    ports:
      - "80:80"
    depends_on:
      - backend
    restart: unless-stopped

  backend:
    image: node:20-alpine
    working_dir: /app
    volumes:
      - ./server:/app
    command: node index.js
    ports:
      - "4000:4000"
    environment:
      - NODE_ENV=production
    restart: unless-stopped
